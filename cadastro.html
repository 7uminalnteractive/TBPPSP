<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — THE BEST PATCH PSP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230A0705%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22%23FF6B1A%22 text-anchor=%22middle%22>G</text></svg>">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

<div class="bg-glow"></div>

<div class="auth-shell">
  <a href="index.html" class="auth-back-link">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
    Voltar ao site
  </a>

  <div class="auth-card">
    <div class="brand" style="margin-bottom:28px;">
      <img src="assets/img/logo-gmpes.png" alt="THE BEST PATCH PSP" class="brand-logo-img">
      <span class="brand-tag">PATCHES PARA PES 2014</span>
    </div>

    <h1 class="auth-title">Criar conta</h1>
    <p class="auth-subtitle">Cadastre-se para acompanhar seus patches e futuras novidades.</p>

    <div class="auth-notice">
      Cadastro ainda não está ativo — estamos preparando essa parte. Em breve você poderá criar sua conta de verdade por aqui.
    </div>

    <form class="auth-form" id="signupForm">
      <label class="auth-field">
        <span>Nome</span>
        <div class="auth-input-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input type="text" id="signupName" placeholder="Seu nome" autocomplete="name">
        </div>
      </label>

      <label class="auth-field">
        <span>E-mail</span>
        <div class="auth-input-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
          <input type="email" id="signupEmail" placeholder="seuemail@exemplo.com" autocomplete="email">
        </div>
      </label>

      <label class="auth-field">
        <span>Senha</span>
        <div class="auth-input-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="signupPassword" placeholder="Crie uma senha" autocomplete="new-password">
          <button type="button" class="auth-toggle-visibility" data-target="signupPassword" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>

      <label class="auth-field">
        <span>Confirmar senha</span>
        <div class="auth-input-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="signupPasswordConfirm" placeholder="Repita sua senha" autocomplete="new-password">
          <button type="button" class="auth-toggle-visibility" data-target="signupPasswordConfirm" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>

      <button type="submit" class="btn btn-primary auth-submit-btn">Criar conta</button>

      <div class="auth-divider"><span>ou</span></div>

      <button type="button" class="auth-social-btn" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.09V7.06H2.18A11 11 0 0 0 1 12c0 1.78.43 3.46 1.18 4.94l3.66-2.85Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53Z"/></svg>
        Continuar com Google
      </button>
      <button type="button" class="auth-social-btn" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.365 1.43c0 1.14-.415 2.07-1.246 2.79-.933.833-2.056 1.284-3.056 1.216-.126-1.075.42-2.207 1.212-2.94.86-.797 2.336-1.402 3.09-1.066ZM20.24 17.53c-.53 1.226-.78 1.77-1.464 2.85-.955 1.51-2.304 3.39-3.973 3.404-1.483.014-1.865-.964-3.877-.953-2.013.011-2.435.97-3.918.956-1.67-.017-2.945-1.712-3.9-3.222C.93 17.44-.14 12.34 1.393 9.038c.792-1.71 2.226-2.897 3.777-2.911 1.484-.014 2.882 1 3.878 1 .995 0 2.708-1.237 4.567-1.056.777.033 2.96.315 4.36 2.373-3.55 1.95-2.99 6.6-.176 8.087Z"/></svg>
        Continuar com Apple
      </button>
    </form>

    <p class="auth-switch">Já tem uma conta? <a href="login.html">Entrar</a></p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
