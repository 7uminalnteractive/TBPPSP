<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — THE BEST PATCH PSP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230A0705%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22%23FF6B1A%22 text-anchor=%22middle%22>G</text></svg>">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="cart-pages.css">
</head>
<body>

<div class="bg-glow"></div>
<div class="sidebar-overlay" id="overlay"></div>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/img/logo-gmpes.png" alt="THE BEST PATCH PSP" class="brand-logo-img">
      <span class="brand-tag">PATCHES PARA PES 2014</span>
    </div>

    <nav>
      <div class="nav-group-label">Navegação</div>
      <ul class="nav-list">
        <li><a class="nav-link" href="index.html#inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          Início
        </a></li>
        <li><a class="nav-link" href="index.html#catalogo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Catálogo
        </a></li>
      </ul>

      <div class="nav-group-label" style="margin-top:24px;">Biblioteca</div>
      <ul class="nav-list">
        <li>
          <button class="nav-link nav-link-disabled" disabled title="Em desenvolvimento">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            GMP Gameport
            <span class="nav-soon">em breve</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="main">

    <header class="topbar">
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <a href="carrinho.html" class="patch-back-link" id="checkoutBackLink">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          <span id="checkoutBackLabel">Voltar ao carrinho</span>
        </a>
      </div>
      <a href="index.html#inicio" class="topbar-logo">
        <img src="assets/img/logo-gmpes.png" alt="THE BEST PATCH PSP">
      </a>
      <div class="topbar-actions"></div>
    </header>

    <main class="cart-page">
      <div class="cart-page-head">
        <h1 class="cart-page-title">Pagamento</h1>
      </div>

      <div id="checkoutLayout" class="checkout-layout">
        <div>
          <div class="checkout-card">
            <h2>Forma de pagamento</h2>
            <div class="payment-methods" id="paymentMethods">
              <label class="payment-method selected" data-method="pix">
                <input type="radio" name="payment" value="pix" checked>
                <span class="payment-method-radio"></span>
                <span class="payment-method-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><rect x="8" y="8" width="8" height="8" rx="2" transform="rotate(45 12 12)"/></svg>
                </span>
                <span>
                  <span class="payment-method-name">PIX</span>
                  <span class="payment-method-desc">Aprovação imediata</span>
                </span>
              </label>

              <label class="payment-method" data-method="card">
                <input type="radio" name="payment" value="card">
                <span class="payment-method-radio"></span>
                <span class="payment-method-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                </span>
                <span>
                  <span class="payment-method-name">Cartão de crédito</span>
                  <span class="payment-method-desc">Visa, Mastercard e mais</span>
                </span>
              </label>

              <label class="payment-method" data-method="boleto">
                <input type="radio" name="payment" value="boleto">
                <span class="payment-method-radio"></span>
                <span class="payment-method-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M8 4v16M12 4v16M16 4v16M20 4v16" stroke-dasharray="1 3"/></svg>
                </span>
                <span>
                  <span class="payment-method-name">Boleto</span>
                  <span class="payment-method-desc">Compensação em até 2 dias úteis</span>
                </span>
              </label>
            </div>
          </div>
        </div>

        <div>
          <div class="checkout-card">
            <h2>Resumo do pedido</h2>
            <div class="checkout-summary-list" id="checkoutSummaryList"></div>

            <div id="checkoutCouponBox" style="display:none;">
              <div class="cart-summary-divider"></div>
              <h2>Cupom</h2>
              <div class="cart-coupon-row">
                <input type="text" id="couponInput" placeholder="Digite o cupom">
                <button class="btn btn-ghost btn-sm" id="couponApplyBtn" type="button">Aplicar</button>
              </div>
              <p class="cart-coupon-note" id="couponNote"></p>
            </div>

            <div class="cart-summary-divider"></div>
            <div class="cart-summary-row">
              <span>Subtotal</span>
              <span id="checkoutSubtotal">R$ 0,00</span>
            </div>
            <div class="cart-summary-row">
              <span>Desconto</span>
              <span id="checkoutDiscount">R$ 0,00</span>
            </div>
            <div class="cart-summary-row cart-summary-total">
              <span>Total</span>
              <span id="checkoutTotal">R$ 0,00</span>
            </div>
            <button class="btn btn-primary checkout-finish-btn" id="finishBtn">Finalizar compra</button>
          </div>
        </div>
      </div>

      <div id="checkoutEmpty" class="cart-empty" style="display:none;">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12L6 6Z"/><path d="M6 6 5 2H2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
        <h2>Seu carrinho está vazio</h2>
        <p>Adicione patches ao carrinho antes de ir para o pagamento.</p>
        <a href="index.html#catalogo" class="btn btn-primary">Ver catálogo</a>
      </div>
    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="store.js"></script>
<script src="cart.js"></script>
<script src="checkout.js"></script>
</body>
</html>
