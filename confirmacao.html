<!DOCTYPE html>
<html lang="pt-BR">
<head>

<body>

<div class="bg-glow"></div>

<div class="confirmation-page">
  <div class="confirmation-card">
    <div class="confirmation-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>

      <button class="btn btn-primary" id="installerBtn">Ir para o instalador do patch</button>
      <a href="index.html#inicio" class="btn btn-ghost">Voltar ao início</a>
    </div>
  </div>
</div>

<script>
document.getElementById("installerBtn").addEventListener("click", () => {
  alert("O instalador do GMP Gameport ainda está em desenvolvimento. Em breve você poderá instalar seus patches por aqui.");
});
</script>
